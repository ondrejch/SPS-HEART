name: release

# Build the wheel and the source distribution of a published release, test
# the wheel in a clean environment, and attach both to the release together
# with the fit report the event writer reads. Build the container image of
# the release, test it, and push it to ghcr.io/ondrejch/sps-heart.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to build and attach (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and the source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build -o dist dev/mixing2006
          cp dev/00runs/r146_regenerated_2026-11-06/report.json dist/r146_report.json
          ls -l dist
      - name: Check that the version matches the tag
        run: |
          version="${TAG#v}"
          test -f "dist/sps_heart-${version}-py3-none-any.whl"
      - name: Generate events from the installed wheel outside the checkout
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          mkdir /tmp/smoke && cp dist/r146_report.json /tmp/smoke/ && cd /tmp/smoke
          root=$(/tmp/venv/bin/python -I -c "from na49_mixing._paths import nested_root; print(nested_root())")
          /tmp/venv/bin/python -I -m helpers.benchmarking.heart_events \
              --spec "$root/config/runs/r146.json" --report r146_report.json \
              --events 10 --workers 2 --out events.jsonl
          head -1 events.jsonl | python -c "import json,sys; assert json.load(sys.stdin)['format'] == 'heart-events/1'"
          test "$(wc -l < events.jsonl)" -eq 11
      - name: Attach the files to the release
        run: gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/r146_report.json --clobber

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      IMAGE: ghcr.io/ondrejch/sps-heart
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Read the version
        run: |
          version="${TAG#v}"
          grep -q "^version = \"${version}\"$" dev/mixing2006/pyproject.toml
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }},${{ env.IMAGE }}:latest
      - name: Generate events from the image
        run: |
          mkdir smoke && cd smoke
          docker run --rm -v "$PWD":/work "$IMAGE:$VERSION" --events 5 --workers 2 --out /work/ev.jsonl
          head -1 ev.jsonl | python3 -c "import json,sys; assert json.load(sys.stdin)['format'] == 'heart-events/1'"
          test "$(wc -l < ev.jsonl)" -eq 6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
