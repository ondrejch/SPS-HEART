name: tests

# Fast tier and the table-reading tests on every pull request and push to main.
# The full suite and an event-generation smoke test run on main, weekly, and by hand.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: fast tier (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: dev/mixing2006/pyproject.toml
      - name: install
        run: python -m pip install -e "dev/mixing2006[dev]"
      - name: fast tier
        working-directory: dev/mixing2006
        env:
          NA49_TEST_TIER: fast
        run: python -m pytest -q -p no:cacheprovider -n auto --durations=15
      - name: tests on the NA49 and SPS tables
        working-directory: dev/mixing2006
        env:
          NA49_TEST_TIER: fast
        run: python -m pytest -q -p no:cacheprovider -n auto -m external_data

  full:
    name: full suite
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dev/mixing2006/pyproject.toml
      - name: install
        run: python -m pip install -e "dev/mixing2006[dev]"
      - name: full suite
        working-directory: dev/mixing2006
        run: python -m pytest -q -p no:cacheprovider -n auto --durations=15
      - name: tests on the NA49 and SPS tables
        working-directory: dev/mixing2006
        run: python -m pytest -q -p no:cacheprovider -n auto -m external_data

  events:
    name: event generation smoke test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dev/mixing2006/pyproject.toml
      - name: install
        run: python -m pip install -e "dev/mixing2006"
      - name: generate 50 events at the published point
        run: >
          python helpers/benchmarking/heart_events.py
          --spec dev/mixing2006/config/runs/r146.json
          --report dev/00runs/r146_regenerated_2026-11-06/report.json
          --events 50 --workers 2 --out heart_events.jsonl
      - name: check the output
        run: |
          python - <<'EOF'
          import json
          lines = [json.loads(l) for l in open("heart_events.jsonl") if l.strip()]
          header, events = lines[0], lines[1:]
          assert header.get("format") == "heart-events/1", header.get("format")
          assert len(events) == 50, len(events)
          print(f"header {header['format']}, {len(events)} events")
          EOF
