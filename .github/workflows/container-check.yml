name: container check

# Build the container image and generate events from it when a pull request
# changes the image or the packaging. The release workflow builds and pushes
# the image of each published release.

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/release.yml
      - .github/workflows/container-check.yml
      - dev/mixing2006/pyproject.toml
      - dev/mixing2006/setup.py
      - dev/mixing2006/MANIFEST.in

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sps-heart:check
      - name: Generate events from the image
        run: |
          mkdir smoke && cd smoke
          docker run --rm -v "$PWD":/work sps-heart:check --events 5 --workers 2 --out /work/ev.jsonl
          head -1 ev.jsonl | python3 -c "import json,sys; assert json.load(sys.stdin)['format'] == 'heart-events/1'"
          test "$(wc -l < ev.jsonl)" -eq 6
